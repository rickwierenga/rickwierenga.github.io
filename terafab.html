function imageBounds(lat,lng){return [project(180,759.5,lat,lng,false),project(940,-0.5,lat,lng,false)];}
const graphicLayer=L.svgOverlay(graphic,imageBounds(40.758,-73.978),{opacity:.62,interactive:false}).addTo(map);
let buildingCenter=L.latLng(40.758,-73.978),dragOffset=null;
const marker=L.marker(buildingCenter,{draggable:true,autoPan:true,title:'Drag to move Terafab',icon:L.divIcon({className:'handle',html:'↔',iconSize:[36,36],iconAnchor:[18,18]})}).addTo(map);
let rotationDrag=null;
const rotateMarker=L.marker(buildingCenter,{draggable:true,autoPan:true,title:'Drag to rotate Terafab',icon:L.divIcon({className:'handle rotate-handle',html:'↻',iconSize:[36,36],iconAnchor:[18,18]})}).addTo(map);
function syncHandle(){
 const bottom=map.latLngToLayerPoint([polygon.getBounds().getSouth(),buildingCenter.lng]);
 marker.setLatLng(map.layerPointToLatLng(bottom.add([-24,38])));
 if(!rotationDrag)rotateMarker.setLatLng(map.layerPointToLatLng(bottom.add([24,38])));
}
function move(latlng,updateHandle=true){
 buildingCenter=L.latLng(Math.max(-80,Math.min(80,latlng.lat)),latlng.lng);
 polygon.setLatLngs(corners(buildingCenter.lat,buildingCenter.lng));
 graphicLayer.setBounds(imageBounds(buildingCenter.lat,buildingCenter.lng));
 if(updateHandle)syncHandle();
}
marker.on('dragstart',()=>{dragOffset=map.latLngToLayerPoint(marker.getLatLng()).subtract(map.latLngToLayerPoint(buildingCenter));});
marker.on('drag',()=>{if(dragOffset)move(map.layerPointToLatLng(map.latLngToLayerPoint(marker.getLatLng()).subtract(dragOffset)),false);});
marker.on('dragend',()=>{dragOffset=null;syncHandle();});
map.on('zoomend',syncHandle);
map.on('click',e=>move(e.latlng));
polygon.on('click',e=>{L.DomEvent.stopPropagation(e);move(e.latlng);});
syncHandle();
function pointerAngle(latlng){
 const delta=map.latLngToLayerPoint(latlng).subtract(map.latLngToLayerPoint(buildingCenter));
 return Math.atan2(delta.y,delta.x)/rad;
}
rotateMarker.on('dragstart',()=>{rotationDrag={angle:pointerAngle(rotateMarker.getLatLng()),rotation};});
rotateMarker.on('drag',()=>{
 if(!rotationDrag)return;
 rotation=rotationDrag.rotation+pointerAngle(rotateMarker.getLatLng())-rotationDrag.angle;
 graphic.querySelector('#rotated-building').setAttribute('transform','rotate('+rotation+' 560 379.5)');
 move(buildingCenter);
});
rotateMarker.on('dragend',()=>{rotationDrag=null;syncHandle();});
rotateMarker.on('keydown',e=>{
 if(e.originalEvent.key!=='ArrowLeft'&&e.originalEvent.key!=='ArrowRight')return;
 L.DomEvent.preventDefault(e.originalEvent);
 rotation+=e.originalEvent.key==='ArrowLeft'?-5:5;
 graphic.querySelector('#rotated-building').setAttribute('transform','rotate('+rotation+' 560 379.5)');
 move(buildingCenter);
});

const input=document.getElementById('place'),resultList=document.getElementById('results'),searchButton=document.getElementById('go');
const searchCache=new Map();let controller=null,lastRequest=0,searchVersion=0;
input.addEventListener('input',()=>{searchVersion++;controller?.abort();resultList.replaceChildren();statusEl.textContent='';searchButton.disabled=false;});
document.getElementById('search').addEventListener('submit',async e=>{
 e.preventDefault();const original=input.value.trim();if(!original)return;
 const q=original.replace(/\bsan\s+fransisco\b/gi,'San Francisco');
 const version=++searchVersion;controller?.abort();controller=new AbortController();
 const signal=controller.signal;searchButton.disabled=true;resultList.replaceChildren();statusEl.textContent='Finding places…';
 try{
  let results=searchCache.get(q.toLowerCase());
  if(!results){
   const delay=Math.max(0,1100-(Date.now()-lastRequest));
   if(delay)await new Promise(resolve=>setTimeout(resolve,delay));
   if(signal.aborted)return;lastRequest=Date.now();
   const params=new URLSearchParams({format:'jsonv2',limit:'6',addressdetails:'1','accept-language':'en',q});
   const response=await fetch('https://nominatim.openstreetmap.org/search?'+params,{signal});
   if(!response.ok)throw Error();results=await response.json();
   searchCache.set(q.toLowerCase(),results);
  }
  if(version!==searchVersion)return;
  if(!results.length){statusEl.textContent='No matching places. Try adding a state or country.';return;}
  statusEl.textContent=q!==original?'Showing matches for '+q+'. Choose a place:':'Choose a place:';
  const seen=new Set();
  for(const result of results){
   const lat=Number(result.lat),lng=Number(result.lon);
   if(!Number.isFinite(lat)||!Number.isFinite(lng)||seen.has(result.display_name))continue;
   seen.add(result.display_name);
   const option=document.createElement('button');option.type='button';option.textContent=result.display_name;
   option.addEventListener('click',()=>{
    move(L.latLng(lat,lng));map.fitBounds(polygon.getBounds(),{padding:[60,60],maxZoom:13});
    input.value=result.name||result.display_name.split(',')[0];resultList.replaceChildren();statusEl.textContent=result.display_name;
   });resultList.append(option);
  }
 }catch(error){if(error.name!=='AbortError'&&version===searchVersion)statusEl.textContent='Search is unavailable. Try again shortly, or pan the map.';}
 finally{if(version===searchVersion)searchButton.disabled=false;}
});
}
